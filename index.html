<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CyberLab | تسجيل الدخول</title>
<link rel="stylesheet" href="css/style.css">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&family=Share+Tech+Mono&display=swap" rel="stylesheet">
</head>
<body class="auth-body">

<div class="auth-container">
  <div class="auth-box">
    <div class="auth-logo">
      <span class="logo-icon">🛡️</span>
      <h1 class="glitch" data-text="CyberLab">CyberLab</h1>
      <p>مختبر الأمن السيبراني التفاعلي</p>
    </div>

    <div class="auth-tabs">
      <button class="auth-tab active" onclick="switchTab('login')">🔑 تسجيل دخول</button>
      <button class="auth-tab" onclick="switchTab('register')">👤 حساب جديد</button>
    </div>

    <!-- تسجيل الدخول -->
    <div id="loginForm" class="auth-form active">
      <input type="text" id="loginUser" class="input-field" placeholder="اسم المتدرب" autocomplete="off">
      <input type="password" id="loginPass" class="input-field" placeholder="كلمة المرور">
      <button class="btn-main" onclick="login()">▶ تسجيل الدخول</button>
      <p id="loginError" class="error-msg"></p>
    </div>

    <!-- تسجيل جديد -->
    <div id="registerForm" class="auth-form">
      <input type="text" id="regUser" class="input-field" placeholder="اسم المتدرب الجديد" autocomplete="off">
      <input type="password" id="regPass" class="input-field" placeholder="كلمة المرور (6 أحرف+)">
      <input type="password" id="regPass2" class="input-field" placeholder="تأكيد كلمة المرور">
      <button class="btn-main" onclick="register()">🚀 إنشاء حساب</button>
      <p id="registerError" class="error-msg"></p>
    </div>

    <p class="auth-note">🔒 كل البيانات محلية على جهازك فقط</p>
  </div>
</div>

<script src="js/auth.js"></script>
</body>
</html>
